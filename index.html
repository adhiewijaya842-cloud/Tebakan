<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAN IBADZ - Cyberpunk Logic Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030308;
            --card-bg: rgba(12, 14, 28, 0.92);
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --text-color: #e0e6ed;
            --border-glow: 0 0 12px var(--neon-cyan), inset 0 0 15px rgba(0, 243, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(255, 0, 85, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 85, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            padding: 25px;
            box-shadow: var(--border-glow);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 20;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed rgba(0, 243, 255, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            letter-spacing: 4px;
        }

        .sub-title {
            font-size: 0.85rem;
            color: var(--neon-yellow);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            margin-bottom: 20px;
            text-align: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            color: var(--neon-cyan);
        }

        .rank-value {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .question-box {
            background: rgba(5, 5, 15, 0.95);
            border-left: 4px solid var(--neon-magenta);
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            min-height: 90px;
            display: flex;
            align-items: center;
            font-size: 1.15rem;
            line-height: 1.4;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .btn-option {
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 12px 18px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--neon-cyan);
            font-weight: bold;
        }

        .btn-option.correct {
            background: var(--neon-green) !important;
            color: #000 !important;
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-option.wrong {
            background: var(--neon-magenta) !important;
            color: #fff !important;
            border-color: var(--neon-magenta) !important;
            box-shadow: 0 0 15px var(--neon-magenta);
        }

        .controls-bar {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-cyber {
            background: transparent;
            border: 1px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: 'Orbitron', sans-serif;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-cyber:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 10px var(--neon-yellow);
        }

        .stage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--neon-cyan);
            border-radius: 6px;
            margin: 15px 0;
        }

        .stage-btn {
            background: rgba(15, 15, 30, 0.9);
            border: 1px solid #444;
            color: #666;
            padding: 10px 0;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: not-allowed;
        }

        .stage-btn.unlocked {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            cursor: pointer;
        }

        .stage-btn.unlocked:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .stage-btn.current {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            font-weight: bold;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 12, 0.95);
            z-index: 30;
            border-radius: 10px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .modal h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="title">MAN IBADZ</div>
            <div class="sub-title">Cyberpunk Riddle Protocol</div>
        </div>

        <div class="dashboard">
            <div class="stat-box">
                <span class="stat-label">RANK</span>
                <span class="stat-value rank-value" id="rank-display">CYBER THINKER</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">STAGE</span>
                <span class="stat-value" id="stage-display">1 / 200</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">SOAL</span>
                <span class="stat-value" id="q-progress-display">1 / 5</span>
            </div>
        </div>

        <div class="question-box" id="question-text">
            MENINGKATKAN PROSESOR LOGIKA...
        </div>

        <div class="options-grid" id="options-container"></div>

        <div class="controls-bar">
            <button class="btn-cyber" onclick="openStageSelect()">PILIH STAGE</button>
            <span style="font-size: 0.85rem; color: #888;">LOGIKA TIER: <span id="difficulty-display" style="color:var(--neon-cyan)">LEVEL 1</span></span>
        </div>

        <!-- Modal Notifikasi -->
        <div class="modal" id="modal-popup">
            <h2 id="modal-title">STAGE CLEARED!</h2>
            <p id="modal-desc">Sistem mengonfirmasi kecerdasan Anda...</p>
            <button class="btn-cyber" onclick="closeModal()">LANJUTKAN</button>
        </div>

        <!-- Modal Stage Selector -->
        <div class="modal" id="modal-stage-select">
            <h2>STAGE SELECT</h2>
            <p style="font-size: 0.9rem; color:#aaa;">Pilih stage yang telah berhasil Anda retas:</p>
            <div class="stage-grid" id="stage-grid-container"></div>
            <button class="btn-cyber" onclick="closeStageSelect()">TUTUP</button>
        </div>
    </div>

    <script>
        /* 1. SISTEM RANK CYBERPUNK */
        const RANKS = [
            "CYBER THINKER",     // Stage 1 - 100
            "LOGIC HACKER",      // Stage 101 - 200
            "MIND NETRUNNER",    // Stage 201 - 300
            "NEURAL ARCHITECT",  // Stage 301 - 400
            "GHOST AI MASTER"    // Stage 401+
        ];

        /* 2. BANK SOAL LOGIKA & KEHIDUPAN (Dihasilkan hingga 1000+ Soal) */
        const baseRiddles = [
            // Tier 1 - Dasar Kehidupan & Logika
            { q: "Makin dipotong makin tinggi, apakah itu?", options: ["Celana panjang", "Rambut", "Pohon", "Kertas"], answer: 0, tier: 1 },
            { q: "Makin diisi makin ringan, benda apakah yang dimaksud?", options: ["Ember", "Balon gas", "Dompet", "Perahu"], answer: 1, tier: 1 },
            { q: "Punya banyak gigi tapi tidak bisa menggigit, apakah itu?", options: ["Buaya", "Sisir", "Gergaji mesin", "Roda gigi"], answer: 1, tier: 1 },
            { q: "Jika dikaitkan dengan waktu: Apa yang selalu datang tapi tidak pernah tiba?", options: ["Hari esok", "Masa lalu", "Paket belanja", "Malam"], answer: 0, tier: 1 },
            { q: "Bisa jalan tapi tidak punya kaki, bisa menangis tapi tidak punya mata. Apakah itu?", options: ["Awan", "Sungai", "Angin", "Bayangan"], answer: 0, tier: 1 },
            { q: "Punya mata satu tapi tidak bisa melihat, apakah aku?", options: ["Cermin", "Jarum jahit", "Kamera", "Lampu jalan"], answer: 1, tier: 1 },
            { q: "Semakin banyak diambil, semakin besar keberadaannya. Apakah itu?", options: ["Uang", "Lubang", "Waktu", "Makanan"], answer: 1, tier: 1 },
            { q: "Siapa yang membuat tidak memutuhkannya, yang membeli tidak memakainya, dan yang memakai tidak mengetahuinya?", options: ["Peti mati", "Baju bayi", "Sepatu", "Kacamata"], answer: 0, tier: 1 },
            { q: "Aku ringan seperti bulu, tetapi orang terkuat pun tidak bisa memegangku lebih dari 5 menit. Apakah aku?", options: ["Napas", "Air", "Gelembung Sabun", "Es Batu"], answer: 0, tier: 1 },
            { q: "Apa yang harus dipatahkan sebelum bisa digunakan?", options: ["Janji", "Pensil", "Telur", "Tongkat"], answer: 2, tier: 1 }
        ];

        function generate1000Riddles() {
            let riddles = [...baseRiddles];

            // Template Generator Logika Kehidupan untuk menggenapkan 1000+ Soal
            const logicTemplates = [
                {
                    q: (id, t) => `[Skenario Logika #${id}] Jika sebuah mikrochip dipasang pada 3 gerbang logika secara seri, berapa banyak gerbang yang mati jika gerbang ke-2 terputus?`,
                    opts: (id) => ["2 Gerbang", "1 Gerbang", "3 Gerbang", "0 Gerbang"],
                    ans: 0
                },
                {
                    q: (id, t) => `[Teka-teki Waktu #${id}] Di dunia Cyber-City, sebuah lampu neon berkedip tiap 3 detik dan lampu lain tiap 4 detik. Berapa detik sekali mereka berkedip bersamaan?`,
                    opts: (id) => ["7 detik", "12 detik", "10 detik", "24 detik"],
                    ans: 1
                },
                {
                    q: (id, t) => `[Perspektif Kehidupan #${id}] Di sebuah ruangan ada 3 lilin dan 2 lampu minyak. Jika angin kencang bertiup dan mematikan 2 lilin, berapa sisa sumber cahaya yang tersisa dalam ruang?`,
                    opts: (id) => ["3 Sumber", "2 Lilin (yang mati)", "5 Sumber", "0"],
                    ans: 0
                },
                {
                    q: (id, t) => `[Analisis Node #${id}] Seorang peretas melompati 5 lantai bangunan dalam sekali waktu. Jika ia mulai dari lantai dasar (-1), di lantai berapakah ia berada sekarang?`,
                    opts: (id) => ["Lantai 4", "Lantai 5", "Lantai 3", "Lantai 6"],
                    ans: 0
                }
            ];

            for (let i = riddles.length + 1; i <= 1000; i++) {
                let tier = Math.min(Math.ceil(i / 100), 10);
                let template = logicTemplates[i % logicTemplates.length];

                riddles.push({
                    q: template.q(i, tier),
                    options: template.opts(i),
                    answer: template.ans,
                    tier: tier
                });
            }
            return riddles;
        }

        const ALL_QUESTIONS = generate1000Riddles();

        /* 3. GAME STATE */
        let maxUnlockedStage = 1;
        let activeStage = 1;
        let questionInStage = 0;
        let activeStageQuestions = [];
        let isAnsweringAllowed = true;

        // DOM Elements
        const questionEl = document.getElementById("question-text");
        const optionsEl = document.getElementById("options-container");
        const stageDisplay = document.getElementById("stage-display");
        const qProgressDisplay = document.getElementById("q-progress-display");
        const rankDisplay = document.getElementById("rank-display");
        const difficultyDisplay = document.getElementById("difficulty-display");
        const modalPopup = document.getElementById("modal-popup");
        const modalStageSelect = document.getElementById("modal-stage-select");
        const stageGridContainer = document.getElementById("stage-grid-container");

        /* 4. LOGIKA PERMAINAN */
        function initGame() {
            const savedMaxStage = localStorage.getItem("manibadz_riddle_maxstage");
            if (savedMaxStage) {
                maxUnlockedStage = parseInt(savedMaxStage);
                activeStage = maxUnlockedStage;
            }

            updateRank();
            startStage(activeStage);
        }

        function updateRank() {
            let rankIndex = Math.floor((maxUnlockedStage - 1) / 100);
            if (rankIndex >= RANKS.length) rankIndex = RANKS.length - 1;
            rankDisplay.innerText = RANKS[rankIndex];
        }

        function startStage(stageNum) {
            activeStage = stageNum;
            questionInStage = 0;

            let stageTier = Math.min(Math.ceil(stageNum / 20), 10);
            
            // Ambil pool soal yang sesuai tingkat kesulitannya
            let pool = ALL_QUESTIONS.filter(q => q.tier === stageTier);
            if (pool.length < 5) pool = ALL_QUESTIONS;

            // Pengacakan (Shuffle) soal tiap kali stage dimulai
            let shuffled = [...pool].sort(() => 0.5 - Math.random());
            activeStageQuestions = shuffled.slice(0, 5);

            loadQuestion();
        }

        function loadQuestion() {
            isAnsweringAllowed = true;

            if (questionInStage >= 5) {
                completeStage();
                return;
            }

            let qData = activeStageQuestions[questionInStage];

            stageDisplay.innerText = `${activeStage} / ${Math.ceil(ALL_QUESTIONS.length / 5)}`;
            qProgressDisplay.innerText = `${questionInStage + 1} / 5`;
            difficultyDisplay.innerText = `LEVEL ${qData.tier}`;

            questionEl.innerText = qData.q;

            optionsEl.innerHTML = "";
            qData.options.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${optText}</span>`;
                btn.onclick = () => checkAnswer(idx, btn);
                optionsEl.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (!isAnsweringAllowed) return;
            isAnsweringAllowed = false;

            let qData = activeStageQuestions[questionInStage];
            const allButtons = optionsEl.querySelectorAll(".btn-option");

            if (selectedIndex === qData.answer) {
                btnElement.classList.add("correct");
                setTimeout(() => {
                    questionInStage++;
                    loadQuestion();
                }, 800);
            } else {
                btnElement.classList.add("wrong");
                allButtons[qData.answer].classList.add("correct");
                setTimeout(() => {
                    alert("LOGIKA TERBATALKAN! Jawaban salah. Mengulang stage dengan susunan soal acak baru...");
                    startStage(activeStage);
                }, 1000);
            }
        }

        function completeStage() {
            let nextStage = activeStage + 1;

            if (activeStage === maxUnlockedStage) {
                maxUnlockedStage = nextStage;
                localStorage.setItem("manibadz_riddle_maxstage", maxUnlockedStage);
            }

            let oldRankIndex = Math.floor((activeStage - 1) / 100);
            let newRankIndex = Math.floor((maxUnlockedStage - 1) / 100);

            updateRank();

            if (newRankIndex > oldRankIndex && activeStage % 100 === 0) {
                showModal("RANK UPGRADED!", `Luar biasa! Anda meloloskan 100 Stage Logika. Rank Baru: [ ${RANKS[newRankIndex]} ]`);
            } else {
                showModal("STAGE CLEARED!", `Stage ${activeStage} Berhasil Ditembus! Siap lanjut ke Stage ${nextStage}?`);
            }

            activeStage = nextStage;
        }

        /* 5. MODALS & STAGE SELECT */
        function showModal(title, desc) {
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-desc").innerText = desc;
            modalPopup.style.display = "flex";
        }

        function closeModal() {
            modalPopup.style.display = "none";
            startStage(activeStage);
        }

        function openStageSelect() {
            stageGridContainer.innerHTML = "";
            let totalStages = Math.ceil(ALL_QUESTIONS.length / 5);

            for (let i = 1; i <= totalStages; i++) {
                const btn = document.createElement("div");
                btn.className = "stage-btn";
                btn.innerText = i;

                if (i <= maxUnlockedStage) {
       btn.classList.add("unlocked");
                  if (i === activeStage) btn.classList.add("current");
                    btn.onclick = () => {
                        closeStageSelect();
                        startStage(i);
                    };
                }

                stageGridContainer.appendChild(btn);
            }

            modalStageSelect.style.display = "flex";
        }

        function closeStageSelect() {
            modalStageSelect.style.display = "none";
        }

        window.onload = initGame;
    </script>
</body>
</html>
